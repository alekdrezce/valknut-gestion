<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E0E10">

<meta name="mobile-web-app-capable" content="yes">

<title>Valknut Gestión</title>
<style>
@font-face{font-family:'VK Titulos';src:url('fonts/titulos.woff2') format('woff2'),url('fonts/titulos.woff') format('woff'),url('fonts/titulos.ttf') format('truetype'),url('fonts/titulos.otf') format('opentype'),local('Roadgeek 2005 Series 5B');}
@font-face{font-family:'VK Texto';src:url('fonts/texto.woff2') format('woff2'),url('fonts/texto.woff') format('woff'),url('fonts/texto.ttf') format('truetype'),url('fonts/texto.otf') format('opentype'),local('Roadgeek 2005 Mittelschrift');}
:root{
  --bg:#EDEDEF; --panel:#FFFFFF; --ink:#141416; --muted:#65656E; --line:#D9D9DE; --soft:#F4F4F6;
  --nav:#0E0E10; --nav2:#1C1C20; --pri:#D90267; --pri2:#B00154; --oro:#D90267; --oroBg:#FDEBF3;
  --ok:#2E7D57; --bad:#C2410C; --warn:#B86E0A;
  --tit:'VK Titulos','Roadgeek 2005 Series 5B','Bahnschrift','DIN Alternate','Segoe UI',sans-serif;
  --txt:'VK Texto','Roadgeek 2005 Mittelschrift','Bahnschrift','DIN Alternate','Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--txt);color:var(--ink);background:var(--bg);font-size:14px;display:grid;grid-template-columns:220px 1fr;font-variant-numeric:tabular-nums}
nav{background:var(--nav);color:#C8C8CF;display:flex;flex-direction:column;padding:22px 14px;gap:2px;height:100vh}
.brand{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:4px 10px 24px}
.brand svg{width:92px;height:auto}
.brand span{font-size:12px;color:#8C8C96}
nav a{padding:9px 12px;border-radius:5px;cursor:pointer;color:#C8C8CF;text-decoration:none}
nav a:hover{background:var(--nav2);color:#fff}
nav a.on{background:var(--nav2);color:#fff;box-shadow:inset 3px 0 0 var(--pri)}
nav .btn{margin-top:18px}
.promo-flag{margin-top:auto;font-size:12px;color:#FF6FA9;padding:8px 12px;line-height:1.4}
#main{height:100vh;overflow:auto;padding:28px 36px 80px}
h1{font-family:var(--tit);font-size:28px;margin:0 0 4px;font-weight:400;letter-spacing:.3px}
h2{font-family:var(--tit);font-weight:400;letter-spacing:.2px}
h2{font-size:16px;margin:0 0 12px;font-weight:600}
.sub{color:var(--muted);margin:0 0 22px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:18px}
.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:5px;cursor:pointer}
.btn:hover{border-color:#9FB0C1}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri2)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
input,select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#fff;min-width:0}
input.n{width:90px;text-align:right}
textarea{width:100%;min-height:70px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label input,label select,label textarea{font-size:14px;color:var(--ink)}
table{width:100%;border-collapse:collapse}
th{font-weight:600;color:var(--muted);font-size:12px;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid #E7ECF0;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.r{text-align:right}.muted{color:var(--muted)}.oro{color:var(--oro)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.x{border:none;background:none;color:#9AA7B4;font-size:18px;cursor:pointer;padding:0 6px}.x:hover{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px}
.stat span{font-size:12px;color:var(--muted)} .stat b{display:block;font-family:var(--tit);font-weight:400;font-size:28px;margin-top:4px}
.stat.oroB{background:var(--oroBg);border-color:#F4B9D4}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:20px;background:var(--soft);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.dorsal{font-family:var(--tit);font-size:72px;line-height:.85;font-weight:400;color:var(--pri);letter-spacing:-1px}
.dorsal small{font-size:20px;color:var(--muted);letter-spacing:0;font-weight:400}
.head{display:flex;gap:26px;align-items:flex-end;margin-bottom:20px}
.head .fields{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;flex:1}
.tot td{border:none;padding:5px 0}
.tot .big td{font-size:22px;font-weight:700;padding-top:10px;border-top:1px solid var(--line)}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pipe div{background:var(--soft);border-radius:5px;padding:10px;border-top:3px solid}
.pipe b{display:block;font-family:var(--tit);font-weight:400;font-size:26px}
.pipe span{font-size:12px;color:var(--muted)}
.bar{height:8px;background:var(--pri);border-radius:4px;min-width:2px}
.bar{background:var(--nav)}.bar.g{background:var(--pri)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .btn{margin-top:12px}
.warn{background:#FFF4E0;border:1px solid #F0D3A0;color:#7A4A05;border-radius:5px;padding:8px 12px;font-size:13px;margin-top:10px}
dialog{border:none;border-radius:8px;padding:0;box-shadow:0 20px 60px rgba(10,20,35,.35);width:440px}
dialog::backdrop{background:rgba(20,38,58,.45)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0 0 4px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 18px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.tabs-docs{display:flex;flex-direction:column;gap:8px}
.tabs-docs .btn{text-align:left}
.adj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.adj{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.adj .th{height:110px;background:var(--soft) center/contain no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;cursor:pointer}
.adj .th img{max-width:100%;max-height:100%;object-fit:contain}
.adj .bd{padding:8px;display:flex;flex-direction:column;gap:6px}
.adj .fn{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop{border:2px dashed var(--line);border-radius:6px;padding:14px;text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.drop.over{border-color:var(--pri);background:var(--oroBg);color:var(--ink)}
.flist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.flist .f{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--soft);border-radius:5px}
.flist .f a{flex:1;color:var(--ink);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg input{width:46px;text-align:right;padding:5px 4px}
.tg th,.tg td{padding:5px 4px;text-align:center}
.tg td:first-child,.tg th:first-child{text-align:left;padding-left:8px;white-space:nowrap}
.linkbtn{background:none;border:none;color:var(--pri);cursor:pointer;font:inherit;font-size:13px;padding:0}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
[hidden]{display:none !important}
.login{position:fixed;inset:0;background:var(--nav);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;color:#fff}
.login .lg{display:flex;justify-content:center;margin-bottom:6px}
.login h1{text-align:center;color:#fff;font-size:22px;margin:0 0 6px}
.login label{color:#B9B9C2}.login input{background:#1C1C20;border-color:#2E2E34;color:#fff;font-size:16px;padding:10px 12px}
.login .btn{padding:11px;font-size:16px}
.login p{margin:0;color:#FF6FA9;font-size:13px;min-height:18px;text-align:center}
.login .hint{color:#8C8C96;font-size:13px;line-height:1.5;text-align:left}
body.locked nav,body.locked main{visibility:hidden}
#sync{position:fixed;top:10px;right:14px;z-index:20;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;display:flex;gap:6px;align-items:center;color:var(--muted)}
#sync i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
#sync.saving i{background:#D9A43A}#sync.error i{background:var(--bad)}#sync.error{color:var(--bad)}
.hm{}
.ni,.ns{display:none}
@media (max-width:760px){
  html,body{height:auto;min-height:100%}
  body{display:block;font-size:15px;overflow-x:hidden}
  #main{height:auto;overflow:visible;min-width:0;padding:calc(50px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}

  /* Menú inferior con íconos */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom));border-top:1px solid #1C1C20}
  .brand,.promo-flag{display:none}
  nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;font-size:11px;line-height:1.1;border-radius:6px;text-align:center;min-width:0}
  nav a .ni{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav a .nl{display:none} nav a .ns{display:inline}
  nav a:hover{background:none}
  nav a.on{background:none;box-shadow:none;color:#fff}
  nav a.on .ni{stroke:var(--pri)}
  #fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:15;width:56px;height:56px;margin:0;padding:0;border-radius:50%;font-size:0;box-shadow:0 6px 18px rgba(217,2,103,.45)}
  body:not([data-view=inicio]):not([data-view=pedidos]) #fab{display:none}
  .vpedidos-top{display:none}
  #fab::before{content:'+';font-size:32px;line-height:56px;font-weight:300}

  /* Estructura general */
  input,select,textarea{font-size:16px;max-width:100%}
  h1{font-size:24px}
  .sub{margin-bottom:16px}
  .row.between>div>.sub{margin-bottom:10px}
  .row.between>.row{width:100%}
  .row.between>.row>input{flex:1;width:auto !important}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:12px}.stat b{font-size:22px}
  .grid2,.grid2[style]{grid-template-columns:minmax(0,1fr) !important;gap:0}
  .panel{padding:14px;margin-bottom:14px;overflow-x:auto}
  .pipe{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hm{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:10px -14px 14px;padding:0 14px 4px}
  .chip{white-space:nowrap}
  #sync{top:calc(10px + env(safe-area-inset-top));right:10px;padding:5px}
  #sync:not(.error) span{display:none}
  #sync.error{padding:4px 10px}
  dialog{width:calc(100vw - 24px)}
  .adj-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

  /* Encabezado del pedido */
  .head{flex-direction:column;align-items:stretch;gap:14px}
  .head .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .head .fields label:first-child{grid-column:1/-1}
  .head .fields select,.head .fields input{width:100%;min-width:0}
  .dorsal{font-size:52px}
  .dorsal br{display:none}

  /* Tablas convertidas en tarjetas */
  table.cardable,table.cardable tbody,table.cardable tr,table.cardable td{display:block;width:100%}
  table.cardable tr.thr{display:none}
  table.cardable tr{position:relative;background:var(--soft);border-radius:6px;padding:8px 12px;margin-bottom:10px}
  table.cardable tr.click:hover td{background:none}
  table.cardable td{border:none;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;min-width:0}
  table.cardable td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex-shrink:0}
  table.cardable td[data-label=""]::before{display:none}
  table.cardable td:first-child{font-weight:600;font-size:16px;text-align:left;justify-content:flex-start;padding-right:30px}
  table.cardable td:first-child::before{display:none}
  table.cardable td:first-child>input,table.cardable td:first-child>select{width:100% !important;font-weight:400}
  table.cardable td:has(> .x:only-child){position:absolute;top:6px;right:4px;width:auto;padding:0}
  table.cardable td[data-label=""]:not(:first-child){justify-content:flex-end;flex-wrap:wrap}
  table.cardable td input.n{width:110px !important}
  table.cardable td>.row,table.cardable td>div{justify-content:flex-end}
  table.cardable td[data-label="Incluye"]{flex-direction:column;align-items:stretch;text-align:left}
  table.cardable td[data-label="Incluye"]>div.row{justify-content:flex-start}
  table.cardable td[data-label="Incluye"] select{flex:1;min-width:0}
  table.cardable td[data-label="Incluye"] .btn{align-self:flex-start}
  table.keep{font-size:13px} table.keep td,table.keep th{padding:6px 4px}
}
</style>
</head>

</nav>

function migrate(d) {
  const base = structuredClone(DEFAULT);
  d.config = Object.assign(base.config, d.config || {});
  d.config.empresa = Object.assign(structuredClone(DEFAULT.config.empresa), d.config.empresa || {});
  d.config.promo = Object.assign(structuredClone(DEFAULT.config.promo), d.config.promo || {});
  ['telas','productos','clientes','pedidos'].forEach(k => { if (!Array.isArray(d[k])) d[k] = base[k]; });
  d.pedidos.forEach(o => { o.items ||= []; o.pagos ||= []; o.adjuntos ||= []; o.talles ||= {}; });
  ['3XL','4XL','5XL','6XL'].forEach(t => { if (!d.config.talles.includes(t) && !(t === '3XL' && d.config.talles.includes('XXXL'))) d.config.talles.push(t); });
  return d;
}

function stable(v) { // JSON con claves ordenadas, para comparar sin importar el orden
  if (Array.isArray(v)) return '[' + v.map(x => stable(x === undefined ? null : x)).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().filter(k => v[k] !== undefined).map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v === undefined ? null : v);
}
function records() {

  S.telas.forEach((x, i) => add('tela', x.id, { ...x, _o: i }));
  S.productos.forEach((x, i) => add('producto', x.id, { ...x, _o: i }));
  S.clientes.forEach(x => add('cliente', x.id, x));
  S.pedidos.forEach(x => add('pedido', x.id, x));

}

async function sync() {
  if (!sb || !USER || !LOADED) return;
  if (syncing) { dirty = true; return; }
  syncing = true; dirty = false; clearTimeout(retryTimer);
  try {
    const cur = records(), ups = [], dels = [];
    cur.forEach((r, k) => { if (SNAP.get(k) !== r.s) ups.push(r); });
    SNAP.forEach((s, k) => { if (!cur.has(k)) dels.push(k); });
    if (ups.length) {
      const { error } = await sb.from('registros').upsert(ups.map(r => ({ user_id: USER.id, tipo: r.tipo, id: r.id, data: r.data })));
      if (error) throw error;
      ups.forEach(r => SNAP.set(r.tipo + ':' + r.id, r.s));
    }
    for (const k of dels) {
      const i = k.indexOf(':'), tipo = k.slice(0, i), id = k.slice(i + 1);
      const { error } = await sb.from('registros').delete().eq('tipo', tipo).eq('id', id);
      if (error) throw error;
      SNAP.delete(k);
    }
    setStatus('ok');
  } catch (e) {
    console.error(e); setStatus('error');
    retryTimer = setTimeout(sync, 8000);
  } finally {
    syncing = false;
    if (dirty) sync();
  }
}
async function loadCloud() {
  const rows = []; let from = 0;
  for (;;) {
    const { data, error } = await sb.from('registros').select('tipo,id,data').range(from, from + 999);
    if (error) throw error;
    rows.push(...data); if (data.length < 1000) break; from += 1000;
  }
  SNAP.clear();
  if (!rows.length) { S = structuredClone(DEFAULT); LOADED = true; return; } // primera vez: sube los valores iniciales
  const d = { config: null, telas: [], productos: [], clientes: [], pedidos: [] };
  rows.forEach(r => { SNAP.set(r.tipo + ':' + r.id, stable(r.data)); if (r.tipo === 'config') d.config = r.data; else if (COLS[r.tipo]) d[COLS[r.tipo]].push(r.data); });
  d.telas.sort(byO); d.productos.sort(byO);
  S = migrate(d); LOADED = true;
}
function applyRemote(p) {
  const row = p.eventType === 'DELETE' ? p.old : p.new;
  if (!row || !row.tipo || (row.user_id && row.user_id !== USER.id)) return;
  const k = row.tipo + ':' + row.id;
  if (p.eventType === 'DELETE') {
    if (!SNAP.has(k)) return;
    SNAP.delete(k);
    if (COLS[row.tipo]) { const col = S[COLS[row.tipo]], i = col.findIndex(x => x.id === row.id); if (i >= 0) col.splice(i, 1); }
  } else {
    const s = stable(row.data); if (SNAP.get(k) === s) return; // eco de un cambio propio
    SNAP.set(k, s);
    const data = structuredClone(row.data);
    if (row.tipo === 'config') S.config = migrate({ config: data, telas: [], productos: [], clientes: [], pedidos: [] }).config;
    else if (COLS[row.tipo]) {
      const col = S[COLS[row.tipo]], i = col.findIndex(x => x.id === row.id);
      if (i >= 0) col[i] = data; else col.push(data);
      if (row.tipo === 'tela' || row.tipo === 'producto') col.sort(byO);
      if (row.tipo === 'pedido') migrate({ config: S.config, telas: [], productos: [], clientes: [], pedidos: [data] });
    }
  }

}

const prod = id => S.productos.find(p => p.id === id);
const tela = id => S.telas.find(t => t.id === id);
const cliente = id => S.clientes.find(c => c.id === id);
function costoTela(p) { const t = tela(p.tela); return t ? num(t.usd) * num(p.consumo) * num(S.config.tipoCambio) : 0; }
function costo(p, depth = 0) {
  if (!p || depth > 5) return 0;
  if (p.tipo === 'combo') return (p.componentes || []).reduce((a, id) => a + costo(prod(id), depth + 1), 0);
  return costoTela(p) + num(p.confeccion);
}
function expandir(p, cant, acc = {}, depth = 0) { // unidades de prendas simples
  if (!p || depth > 5) return acc;
  if (p.tipo === 'combo') (p.componentes || []).forEach(id => expandir(prod(id), cant, acc, depth + 1));
  else acc[p.id] = (acc[p.id] || 0) + cant;
  return acc;
}
function metros(o) {
  const acc = {};
  o.items.forEach(it => {
    const u = expandir(prod(it.productoId), num(it.cant));
    Object.entries(u).forEach(([pid, c]) => { const p = prod(pid); if (p && p.tela) acc[p.tela] = (acc[p.tela] || 0) + num(p.consumo) * c; });
  });
  return acc;
}
const promoActiva = () => !!S.config.promo.activa && (!S.config.promo.hasta || S.config.promo.hasta >= today());
const precioVigente = p => p ? (promoActiva() && num(p.precioPromo) > 0 ? num(p.precioPromo) : num(p.precioLista)) : 0;
const r2 = n => Math.round(n * 100) / 100;
function tot(o) {
  const sub = o.items.reduce((a, i) => a + num(i.cant) * num(i.precio), 0);
  const total = Math.max(0, sub - num(o.descuento));
  const c = o.items.reduce((a, i) => a + num(i.cant) * num(i.costo), 0);
  const pag = o.pagos.reduce((a, p) => a + num(p.monto), 0);
  return { sub, total, costo: c, ganancia: total - c, margen: total ? (total - c) / total : 0, pagado: pag, saldo: total - pag,
           unidades: o.items.reduce((a, i) => a + num(i.cant), 0) };
}

function setPath(path, v) {
  const parts = path.split('.');
  let obj = parts[0] === 'U' ? U : S;
  if (parts[0] === 'U') parts.shift();
  for (let i = 0; i < parts.length - 1; i++) obj = obj[/^\d+$/.test(parts[i]) ? +parts[i] : parts[i]];
  obj[parts[parts.length - 1]] = v;
}
function getPath(path) {
  const parts = path.split('.'); let obj = S;
  for (const p of parts) obj = obj?.[/^\d+$/.test(p) ? +p : p];
  return obj;
}

/* ================= Render ================= */
function etiquetarTablas(root) { // en el celular, cada fila de tabla se muestra como tarjeta con sus títulos
  root.querySelectorAll('table').forEach(t => {
    if (t.matches('.tot,.tg,.keep')) return;
    const hr = [...t.rows].find(r => r.querySelector('th')); if (!hr) return;
    t.classList.add('cardable'); hr.classList.add('thr');
    const labels = [...hr.cells].map(c => c.textContent.trim());
    [...t.rows].forEach(r => { if (r !== hr) [...r.cells].forEach((c, i) => { c.dataset.label = labels[i] || ''; }); });
  });
}
function render() {
  const m = $('#main'), st = m.scrollTop, wy = window.scrollY;
  const views = { inicio: vInicio, pedidos: vPedidos, pedido: () => vPedido(U.param), clientes: vClientes, productos: vProductos, reportes: vReportes, ajustes: vAjustes };
  m.innerHTML = (views[U.view] || vInicio)();
  etiquetarTablas(m);
  document.body.dataset.view = U.view;
  m.scrollTop = st;
  if (wy) window.scrollTo(0, wy);
  document.querySelectorAll('#nav [data-go]').forEach(a => a.classList.toggle('on', a.dataset.go === U.view || (U.view === 'pedido' && a.dataset.go === 'pedidos')));
  hidratarImagenes();
  $('#promoFlag').textContent = promoActiva() ? `${S.config.promo.nombre} activa${S.config.promo.hasta ? ' hasta el ' + fdate(S.config.promo.hasta) : ''}` : '';
}
function rerender() {
  setTimeout(() => {
    const a = document.activeElement, key = a?.dataset?.f; let s = null;
    try { s = a.selectionStart; } catch (e) {}
    render();
    if (key) { const n = document.querySelector(`[data-f="${key}"]`); if (n) { n.focus({ preventScroll: true }); try { if (s != null) n.setSelectionRange(s, s); } catch (e) {} } }
  }, 0);
}
function go(v, id) { U.view = v; U.param = id || null; $('#main').scrollTop = 0; window.scrollTo(0, 0); render(); }

  ${entregas.map(o => `<tr class="click" data-go="pedido" data-id="${o.id}"><td>${nro(o)}</td><td>${esc(cliente(o.clienteId)?.nombre || 'Sin cliente')}</td><td>${pill(o.estado)}</td>

  ${abiertos.map(o => { const v = addDays(o.fecha, num(S.config.validezDias)); return `<tr class="click" data-go="pedido" data-id="${o.id}"><td>${nro(o)}</td><td>${esc(cliente(o.clienteId)?.nombre || 'Sin cliente')}</td><td>${fdate(o.fecha)}</td><td class="${v < today() ? 'bad' : ''}">${fdate(v)}</td><td class="r">${money(tot(o).total)}</td></tr>`; }).join('')}</table></div>` : ''}`;

/* ---------- Pedido ---------- */
const adjPath = (o, a) => a.path || `${USER.id}/${o.id}/${a.archivo}`;
const URLS = new Map();
async function signedUrls(paths) {
  const need = [...new Set(paths)].filter(p => { const c = URLS.get(p); return !c || c.exp < Date.now() + 60000; });
  if (need.length) {
    const { data, error } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
    if (!error && data) data.forEach(d => { if (d.signedUrl && d.path) URLS.set(d.path, { url: d.signedUrl, exp: Date.now() + 3500e3 }); });
  }
  return paths.map(p => URLS.get(p)?.url || '');
}
function adjURL(o, a) { if (a.dataUrl) return a.dataUrl; return URLS.get(adjPath(o, a))?.url || ''; }
async function hidratarImagenes() {
  const imgs = [...document.querySelectorAll('img[data-path]')].filter(i => !i.getAttribute('src'));
  if (!imgs.length || !sb) return;
  const urls = await signedUrls(imgs.map(i => i.dataset.path));
  imgs.forEach((i, k) => { if (urls[k]) i.src = urls[k]; });
}
const esImagen = a => /^image\//.test(a.tipo || '') || /\.(png|jpe?g|gif|webp|svg)$/i.test(a.nombre || '');
function dropZone(o, cat, texto, extra = '') {
  return `<div class="drop" data-drop="${cat}" data-id="${o.id}" ${extra}>${texto} <button class="linkbtn" data-act="subir" data-cat="${cat}" data-id="${o.id}" ${extra}>elegí archivos</button></div>`;
}
function fileRow(o, a, idx) {
  return `<div class="f"><span>${esImagen(a) ? '🖼️' : '📄'}</span><a data-act="abrirAdj" data-id="${o.id}" data-a="${a.id}" title="Abrir">${esc(a.nombre)}</a>
    <span class="muted" style="font-size:12px">${fdate(a.fecha)}</span><button class="x" data-act="delAdj" data-id="${o.id}" data-a="${a.id}" title="Eliminar archivo">×</button></div>`;
}
function vPedido(id) {

    <td class="r"><input class="n" data-f="telas.${i}.usd" data-t="num" value="${num(t.usd)}"></td><td class="r">${money(num(t.usd) * num(S.config.tipoCambio))}</td>
    <td><button class="x" data-act="delTela" data-i="${i}" title="Eliminar tela">×</button></td></tr>`).join('')}</table>
    <button class="btn sm" data-act="addTela" style="margin-top:10px">Agregar tela</button></div>

  <div class="panel"><div class="row between"><h2>Prendas</h2><button class="btn sm" data-act="addProd">Agregar prenda</button></div>
    <div style="overflow-x:auto"><table><tr><th>Prenda</th><th>Tela</th><th class="r">Metros</th><th class="r">Confección</th>${head}</tr>
    ${simples.map(({ p, i }) => `<tr><td><input data-f="productos.${i}.nombre" value="${esc(p.nombre)}" style="width:170px"></td>
      <td><select data-f="productos.${i}.tela">${S.telas.map(t => `<option value="${t.id}" ${t.id === p.tela ? 'selected' : ''}>${esc(t.nombre)}</option>`).join('')}</select></td>
      <td class="r"><input class="n" style="width:60px" data-f="productos.${i}.consumo" data-t="num" value="${num(p.consumo)}"></td>

/* ---------- Reportes ---------- */
function vReportes() {
  const meses = []; const d = new Date(today() + 'T12:00:00'); d.setDate(1);
  for (let k = 0; k < 12; k++) { meses.unshift(d.toISOString().slice(0, 7)); d.setMonth(d.getMonth() - 1); }
  const vend = S.pedidos.filter(vendido);
  const data = meses.map(m => { const l = vend.filter(o => (o.fecha || '').slice(0, 7) === m); return { m, n: l.length, v: l.reduce((a, o) => a + tot(o).total, 0), g: l.reduce((a, o) => a + tot(o).ganancia, 0), u: l.reduce((a, o) => a + tot(o).unidades, 0) }; });
  const maxV = Math.max(1, ...data.map(x => x.v));
  const nombreMes = m => new Date(m + '-15T12:00:00').toLocaleDateString('es-UY', { month: 'short', year: '2-digit' });
  const top = {}; vend.forEach(o => o.items.forEach(it => { top[it.productoId] = top[it.productoId] || { u: 0, v: 0, g: 0 }; top[it.productoId].u += num(it.cant); top[it.productoId].v += num(it.cant) * num(it.precio); top[it.productoId].g += num(it.cant) * (num(it.precio) - num(it.costo)); }));
  const topL = Object.entries(top).sort((a, b) => b[1].u - a[1].u);
  const deudores = vend.filter(o => tot(o).saldo > 0).sort((a, b) => tot(b).saldo - tot(a).saldo);
  const pres = S.pedidos.filter(o => o.estado !== 'Cancelado').length, conf = vend.length;
  return `<h1>Reportes</h1><p class="sub">Pedidos confirmados (desde seña recibida en adelante), según la fecha del pedido.</p>
  <div class="stats">
    <div class="stat"><span>Vendido total</span><b>${money(vend.reduce((a, o) => a + tot(o).total, 0))}</b></div>
    <div class="stat oroB"><span>Ganancia total</span><b class="oro">${money(vend.reduce((a, o) => a + tot(o).ganancia, 0))}</b></div>
    <div class="stat"><span>Prendas vendidas</span><b>${vend.reduce((a, o) => a + tot(o).unidades, 0)}</b></div>
    <div class="stat"><span>Presupuestos que se confirmaron</span><b>${pres ? Math.round(conf / pres * 100) : 0}%</b></div>
  </div>
  <div class="panel"><h2>Últimos 12 meses</h2><table class="keep"><tr><th>Mes</th><th class="r">Pedidos</th><th class="r">Prendas</th><th class="r">Vendido</th><th class="r">Ganancia</th><th class="hm" style="width:35%"></th></tr>
  ${data.map(x => `<tr><td>${nombreMes(x.m)}</td><td class="r">${x.n}</td><td class="r">${x.u}</td><td class="r">${money(x.v)}</td><td class="r oro">${money(x.g)}</td>
  <td class="hm"><div class="bar" style="width:${x.v / maxV * 100}%"></div><div class="bar g" style="width:${x.g / maxV * 100}%;margin-top:3px"></div></td></tr>`).join('')}</table></div>
  <div class="grid2" style="grid-template-columns:1fr 1fr">
    <div class="panel"><h2>Productos más vendidos</h2>${topL.length ? `<table><tr><th>Producto</th><th class="r">Unid.</th><th class="r">Vendido</th><th class="r">Ganancia</th></tr>
    ${topL.map(([id, x]) => `<tr><td>${esc(prod(id)?.nombre || 'Producto eliminado')}</td><td class="r">${x.u}</td><td class="r">${money(x.v)}</td><td class="r oro">${money(x.g)}</td></tr>`).join('')}</table>` : '<p class="muted">Sin ventas todavía.</p>'}</div>
    <div class="panel"><h2>Saldos por cobrar</h2>${deudores.length ? `<table><tr><th>Nº</th><th>Equipo</th><th>Estado</th><th class="r">Saldo</th></tr>
    ${deudores.map(o => `<tr class="click" data-go="pedido" data-id="${o.id}"><td>${nro(o)}</td><td>${esc(cliente(o.clienteId)?.nombre || '—')}</td><td>${pill(o.estado)}</td><td class="r bad">${money(tot(o).saldo)}</td></tr>`).join('')}</table>` : '<p class="muted">No hay saldos pendientes.</p>'}</div>
  </div>`;
}

  }
  const html = `<!doctype html><html lang="es"><head><meta charset="utf-8"><title>${titulo} ${nro(o)} - ${esc(cli.nombre || 'cliente')}</title><style>${docCSS()}</style></head><body>${body}
  <footer>${esc(e.nombre)}${tipo !== 'taller' ? ' · Documento no válido como factura.' : ''}</footer></body></html>`;
  return { html, titulo };
}

/* ================= Acciones ================= */
function nuevoPedido(clienteId) {
  const o = { id: uid(), numero: num(S.config.proximoNumero) || 1, clienteId: clienteId || '', fecha: today(), entrega: addDays(today(), num(S.config.diasEntrega)),
              estado: 'Presupuesto', items: [], pagos: [], adjuntos: [], talles: {}, descuento: 0, notas: '' };
  S.config.proximoNumero = o.numero + 1;
  S.pedidos.push(o); save(); go('pedido', o.id);
}
const pedidoById = id => S.pedidos.find(o => o.id === id);

function dlgCliente(c, done) {
  const d = $('#dlg');
  d.innerHTML = `<form method="dialog" class="dlg"><h3>${c ? 'Editar cliente' : 'Nuevo cliente'}</h3>
    <label>Equipo o cliente<input name="nombre" required value="${esc(c?.nombre)}"></label>
    <label>Persona de contacto<input name="contacto" value="${esc(c?.contacto)}"></label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label>Teléfono / WhatsApp<input name="telefono" value="${esc(c?.telefono)}" placeholder="09X XXX XXX"></label>
    <label>Deporte<select name="deporte">${['Fútbol', 'Básquet', 'Handball', 'Vóley', 'Otro'].map(x => `<option ${c?.deporte === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label></div>
    <label>Email<input name="email" type="email" value="${esc(c?.email)}"></label>
    <label>Notas<textarea name="notas">${esc(c?.notas)}</textarea></label>
    <div class="row end"><button value="cancel" formnovalidate class="btn">Cancelar</button><button value="ok" class="btn pri">Guardar cliente</button></div></form>`;
  d.onclose = () => {
    if (d.returnValue !== 'ok') return;
    const fd = Object.fromEntries(new FormData(d.querySelector('form')));
    let cl = c;
    if (cl) Object.assign(cl, fd); else { cl = { id: uid(), ...fd }; S.clientes.push(cl); }
    save(); done && done(cl); render(); toast('Cliente guardado');
  };
  d.returnValue = ''; d.showModal();
}

async function pdf(tipo, o) {
  if (!o.items.length && tipo !== 'recibo') { toast('Agregá prendas antes de generar el documento.'); return; }
  const w = window.open('', '_blank');
  if (!w) { toast('Permití las ventanas emergentes para generar el PDF.'); return; }
  w.document.write('<p style="font-family:sans-serif;padding:24px">Preparando documento…</p>');
  if (tipo === 'taller') {
    const imgs = o.adjuntos.filter(a => a.cat === 'diseno' && esImagen(a) && !a.dataUrl);
    try { await signedUrls(imgs.map(a => adjPath(o, a))); } catch (e) {}
  }
  const { html } = docHTML(tipo, o);
  w.document.open(); w.document.write(html); w.document.close();
  try {
    await Promise.all([...w.document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    await w.document.fonts?.ready;
  } catch (e) {}
  setTimeout(() => { w.focus(); w.print(); }, 250);
}

function whatsapp(o) {
  const cli = cliente(o.clienteId) || {}, t = tot(o);
  const vence = addDays(o.fecha, num(S.config.validezDias));
  const lineas = o.items.map(it => `• ${it.cant} × ${prod(it.productoId)?.nombre || ''}: ${money(it.precio)} c/u`).join('\n');
  const txt = `Hola${cli.contacto ? ' ' + cli.contacto.split(' ')[0] : ''}! Te paso el presupuesto Nº ${nro(o)} de ${S.config.empresa.nombre} para ${cli.nombre || 'el equipo'}:\n\n${lineas}\n${num(o.descuento) ? `Descuento: -${money(num(o.descuento))}\n` : ''}\n*Total: ${money(t.total)}*\nSeña para confirmar: ${money(t.total * num(S.config.senaPct) / 100)}\nVálido hasta el ${fdate(vence)}.`;
  let tel = String(cli.telefono || '').replace(/\D/g, '');
  if (tel.startsWith('0')) tel = '598' + tel.slice(1);
  else if (tel.length === 8 && tel.startsWith('9')) tel = '598' + tel;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(txt)}`, '_blank');
}

async function comprimir(f) { // achica fotos grandes para ahorrar espacio (máx. 2400 px)
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 700e3) return f;
  try {
    const img = await createImageBitmap(f), sc = Math.min(1, 2400 / Math.max(img.width, img.height));
    if (sc === 1 && f.type === 'image/png') return f;
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const type = f.type === 'image/png' ? 'image/png' : 'image/jpeg';
    const b = await new Promise(r => c.toBlob(r, type, 0.85));
    return b && b.size < f.size ? new File([b], f.name.replace(/\.\w+$/, type === 'image/png' ? '.png' : '.jpg'), { type }) : f;
  } catch (e) { return f; }
}
const nombreSeguro = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w.-]+/g, '_').slice(-80) || 'archivo';
async function subirArchivos(o, files, cat, pagoId) {
  if (!o || !files.length) return;
  if (!LOADED) return toast('Sin conexión: no se pueden subir archivos ahora.');
  setStatus('saving'); toast(files.length > 1 ? `Subiendo ${files.length} archivos…` : 'Subiendo archivo…');
  let ok = 0;
  for (const f0 of files) {
    if (f0.size > 45e6) { toast(`"${f0.name}" pesa más de 45 MB.`); continue; }
    const f = await comprimir(f0);
    const archivo = uid() + '-' + nombreSeguro(f.name), path = `${USER.id}/${o.id}/${archivo}`;
    const { error } = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || 'application/octet-stream', upsert: false });
    if (error) { console.error(error); toast(`No se pudo subir "${f0.name}".`); continue; }
    o.adjuntos.push({ id: uid(), cat, nombre: f0.name, tipo: f.type, size: f.size, fecha: today(), etiqueta: cat === 'diseno' ? (U.etq || 'Diseño') : '', pagoId: pagoId || null, archivo, path });
    ok++;
  }
  if (cat === 'diseno' && ok === 1) { const mm = /^(.*?)(\d+)$/.exec(U.etq || ''); if (mm) U.etq = mm[1] + (+mm[2] + 1); }
  save(); render(); if (ok) toast(ok > 1 ? 'Archivos guardados' : 'Archivo guardado');
}
async function abrirAdj(o, aid) {
  const a = o?.adjuntos.find(x => x.id === aid); if (!a) return;
  if (a.dataUrl) { const b = await (await fetch(a.dataUrl)).blob(); window.open(URL.createObjectURL(b), '_blank'); return; }
  const w = window.open('', '_blank');
  const [u] = await signedUrls([adjPath(o, a)]);
  if (!u) { w && w.close(); toast('No se encontró el archivo.'); return; }
  if (w) w.location.href = u; else location.href = u;
}

const A = {
  nuevoPedido: () => nuevoPedido(),
  pedidoCliente: el => nuevoPedido(el.dataset.id),
  filtro: el => { U.filtro = el.dataset.v; render(); },
  filtroIr: el => { U.filtro = el.dataset.v; go('pedidos'); },
  addItem: el => { const o = pedidoById(el.dataset.id), p = S.productos[0]; if (!p) return toast('Primero cargá productos.');
    o.items.push({ id: uid(), productoId: p.id, cant: 10, precio: precioVigente(p), costo: r2(costo(p)) }); save(); render(); },
  delItem: el => { pedidoById(el.dataset.id).items.splice(+el.dataset.i, 1); save(); render(); },
  recalc: el => { const o = pedidoById(el.dataset.id); o.items.forEach(it => it.costo = r2(costo(prod(it.productoId)))); save(); render(); toast('Costos actualizados'); },
  addPago: el => { const o = pedidoById(el.dataset.id), m = num($('#pgMonto').value);
    if (m <= 0) return toast('Ingresá un monto mayor a cero.');
    o.pagos.push({ id: uid(), fecha: $('#pgFecha').value || today(), monto: m, metodo: $('#pgMetodo').value });
    if (o.estado === 'Presupuesto') o.estado = 'Seña recibida';
    save(); render(); toast('Pago registrado'); },
  delPago: el => { if (!confirm('¿Borrar este pago?')) return; pedidoById(el.dataset.id).pagos.splice(+el.dataset.i, 1); save(); render(); },
  duplicar: el => { const src = pedidoById(el.dataset.id), o = structuredClone(src);
    Object.assign(o, { id: uid(), numero: num(S.config.proximoNumero), fecha: today(), entrega: addDays(today(), num(S.config.diasEntrega)), estado: 'Presupuesto', pagos: [], adjuntos: [] });
    S.config.proximoNumero = o.numero + 1; S.pedidos.push(o); save(); go('pedido', o.id); toast('Pedido duplicado'); },
  delPedido: el => { if (!confirm('¿Eliminar este pedido? No se puede deshacer.')) return; const po = pedidoById(el.dataset.id); const ps = (po.adjuntos || []).filter(a => a.path).map(a => a.path); if (ps.length) sb.storage.from(BUCKET).remove(ps); S.pedidos = S.pedidos.filter(o => o.id !== el.dataset.id); save(); go('pedidos'); },
  clienteDesdePedido: el => dlgCliente(null, cl => { pedidoById(el.dataset.id).clienteId = cl.id; save(); }),
  nuevoCliente: () => dlgCliente(null),
  editCliente: el => dlgCliente(cliente(el.dataset.id)),
  delCliente: el => { if (S.pedidos.some(o => o.clienteId === el.dataset.id)) return toast('Este cliente tiene pedidos; no se puede eliminar.');
    if (!confirm('¿Eliminar cliente?')) return; S.clientes = S.clientes.filter(c => c.id !== el.dataset.id); save(); render(); },
  addTela: () => { S.telas.push({ id: uid(), nombre: 'Nueva tela', ancho: 1.5, usd: 10 }); save(); render(); },
  delTela: el => { const t = S.telas[+el.dataset.i]; if (S.productos.some(p => p.tela === t.id)) return toast('Hay prendas que usan esta tela.');
    S.telas.splice(+el.dataset.i, 1); save(); render(); },
  addProd: () => { S.productos.push({ id: uid(), tipo: 'simple', nombre: 'Nueva prenda', tela: S.telas[0]?.id || '', consumo: 1, confeccion: 0, precioLista: 0, precioPromo: 0 }); save(); render(); },
  addCombo: () => { const s = S.productos.filter(p => p.tipo !== 'combo').slice(0, 2).map(p => p.id);
    S.productos.push({ id: uid(), tipo: 'combo', nombre: 'Nuevo conjunto', componentes: s, precioLista: 0, precioPromo: 0 }); save(); render(); },
  delProd: el => { const p = S.productos[+el.dataset.i];
    if (S.productos.some(x => x.tipo === 'combo' && (x.componentes || []).includes(p.id))) return toast('Esta prenda es parte de un conjunto.');
    if (!confirm(`¿Eliminar "${p.nombre}"?`)) return; S.productos.splice(+el.dataset.i, 1); save(); render(); },
  addComp: el => { const p = S.productos[+el.dataset.i], f = S.productos.find(x => x.tipo !== 'combo'); if (f) { p.componentes.push(f.id); save(); render(); } },
  delComp: el => { S.productos[+el.dataset.i].componentes.splice(+el.dataset.j, 1); save(); render(); },
  markup: el => { const k = el.dataset.v, f = num($(k === 'precioLista' ? '#mkL' : '#mkP').value);
    if (f <= 0) return toast('Ingresá un multiplicador válido.');
    if (!confirm(`¿Reemplazar todos los precios ${k === 'precioLista' ? 'de lista' : 'promo'} por costo × ${f}?`)) return;
    S.productos.forEach(p => p[k] = round10(costo(p) * f)); save(); render(); toast('Precios actualizados'); },
  pdf: el => pdf(el.dataset.v, pedidoById(el.dataset.id)),
  whatsapp: el => { const o = pedidoById(el.dataset.id); if (!o.items.length) return toast('Agregá prendas antes de enviar.'); whatsapp(o); },
  subir: el => { U.upl = { id: el.dataset.id, cat: el.dataset.cat, pago: el.dataset.pago || null }; $('#fileAdj').click(); },
  abrirAdj: el => abrirAdj(pedidoById(el.dataset.id), el.dataset.a),
  delAdj: el => { const o = pedidoById(el.dataset.id), a = o.adjuntos.find(x => x.id === el.dataset.a);
    if (!a || !confirm(`¿Eliminar "${a.nombre}"?`)) return;
    if (a.path) sb.storage.from(BUCKET).remove([a.path]);
    o.adjuntos = o.adjuntos.filter(x => x !== a); save(); render(); },
  exportar: () => { const j = JSON.stringify(S, null, 1); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([j], { type: 'application/json' })); a.download = `valknut-respaldo-${today()}.json`; a.click(); },
  importar: () => $('#fileImport').click(),
  salir: () => cerrarSesion()
};
function importRaw(raw) {
  try { const d = JSON.parse(raw); if (!d.config || !Array.isArray(d.pedidos)) throw 0;
    if (!confirm('Esto reemplaza todos los datos actuales por los del respaldo. ¿Continuar?')) return;
    let perdidos = 0;
    (d.pedidos || []).forEach(o => { const n = (o.adjuntos || []).length; o.adjuntos = (o.adjuntos || []).filter(a => a.path || a.dataUrl); perdidos += n - o.adjuntos.length; });
    S = migrate(d); save(); go('inicio');
    toast(perdidos ? `Respaldo importado. ${perdidos} archivo(s) del programa de PC hay que volver a subirlos.` : 'Respaldo importado');
  } catch (e) { toast('El archivo no es un respaldo válido de Valknut.'); }
}
const H = { // se ejecutan después de actualizar un campo
  prodChange: el => { const it = getPath(el.dataset.f.replace(/\.productoId$/, '')), p = prod(it.productoId); it.precio = precioVigente(p); it.costo = r2(costo(p)); },
  talles: el => { const l = el.value.split(',').map(x => x.trim()).filter(Boolean); if (l.length) S.config.talles = l; }
};

/* ================= Eventos ================= */
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); go(g.dataset.go, g.dataset.id); return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled) { e.preventDefault(); const f = A[a.dataset.act]; if (f) f(a); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fileImport') { const f = el.files[0]; if (f) f.text().then(importRaw); el.value = ''; return; }
  if (el.id === 'fileAdj') { const files = [...el.files]; el.value = ''; if (U.upl) subirArchivos(pedidoById(U.upl.id), files, U.upl.cat, U.upl.pago); return; }
  if (!el.dataset.f || el.dataset.live) return;
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.t === 'num') v = num(v);
  setPath(el.dataset.f, v);
  if (el.dataset.after && H[el.dataset.after]) H[el.dataset.after](el);
  save(); rerender();
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.live && el.dataset.f) { setPath(el.dataset.f, el.value); rerender(); }
});

['dragenter', 'dragover'].forEach(t => document.addEventListener(t, e => {
  const z = e.target.closest?.('[data-drop]'); if (!e.dataTransfer?.types?.includes('Files')) return;
  e.preventDefault(); document.querySelectorAll('.drop.over').forEach(x => x !== z && x.classList.remove('over')); if (z) z.classList.add('over');
}));
document.addEventListener('dragleave', e => { const z = e.target.closest?.('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('over'); });
document.addEventListener('drop', e => {
  if (!e.dataTransfer?.files?.length) return; e.preventDefault();
  const z = e.target.closest('[data-drop]'); if (!z) return; z.classList.remove('over');
  subirArchivos(pedidoById(z.dataset.id), [...e.dataTransfer.files], z.dataset.drop, null);
});

  // Cuando llega una versión nueva de la app, recarga una sola vez para usarla
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (habiaSW && !sessionStorage.getItem('vk-recargado')) { sessionStorage.setItem('vk-recargado', '1'); location.reload(); } });
}
(async () => {
  if (!sb) return pantallaLogin();
  let session = null;

  if (session) { USER = session.user; iniciar(); } else pantallaLogin();
  sb.auth.onAuthStateChange((ev, s) => { if (ev === 'SIGNED_OUT') location.reload(); else if (s?.user) USER = s.user; });
